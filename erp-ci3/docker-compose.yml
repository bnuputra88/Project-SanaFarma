services:
  app:
    build: { context: ., dockerfile: docker/Dockerfile }
    volumes: [".:/var/www/html"]
    env_file: .env
    depends_on: { db: { condition: service_healthy } }
    healthcheck: { test: ["CMD", "php", "index.php", "cli/health"], interval: 30s, timeout: 10s, retries: 3 }
  web:
    image: nginx:1.25-alpine
    ports: ["8080:80"]
    volumes: [".:/var/www/html:ro", "./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: [app]
  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes: ["dbdata:/var/lib/mysql", "./docker/my.cnf:/etc/mysql/conf.d/erp.cnf:ro"]
    healthcheck: { test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD}"], interval: 10s, retries: 10 }
volumes:
  dbdata: {}
